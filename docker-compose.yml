services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: sentinela-freqtrade
    restart: unless-stopped
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Porta do painel FreqUI. Fica limitada ao proprio PC (127.0.0.1) por seguranca.
    # O acesso pelo telemovel na mesma rede local sera explicado separadamente
    # (implica mudar para 0.0.0.0 e usar sempre uma password forte).
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy SentinelaPlaceholderStrategy
